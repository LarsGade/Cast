name: Windows executable
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-encoder-test:
    outputs:
      diagnostic: ${{ steps.failure-details.outputs.diagnostic }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test bundled FFmpeg on Windows
        shell: pwsh
        run: |
          ./scripts/test-windows-encoder.ps1 *>&1 | Tee-Object windows-encoder-test.log
      - name: Expose encoder failure details
        id: failure-details
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path windows-encoder-test.log) {
            $lines = @(Get-Content windows-encoder-test.log | Where-Object { $_ -match '(?i)error|invalid|exception|failed|not found|checksum|capture area' })
            $diagnosticLine = ($lines -join ' | ') -replace '[\r\n]', ' '
            if ($diagnosticLine.Length -gt 220) { $diagnosticLine = $diagnosticLine.Substring(0, 220) }
            "diagnostic=$diagnosticLine" | Add-Content $env:GITHUB_OUTPUT
            Add-Content $env:GITHUB_STEP_SUMMARY '### Windows encoder failure'
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content windows-encoder-test.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-encoder-diagnostics
          path: windows-encoder-test.log
  windows-result:
    needs: windows-encoder-test
    if: failure()
    name: "Windows error — ${{ needs.windows-encoder-test.outputs.diagnostic }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'See the Windows encoder diagnostic artifact for details.'
  build:
    needs: windows-encoder-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ensure encoder test tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Test and publish
        shell: bash
        run: |
          set -o pipefail
          bash scripts/setup-cloud.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Cast-windows-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Package Windows download
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd artifacts/win-x64
          zip ../Cast-windows-x64.zip *
      - name: Publish test release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/win-x64/Cast.exe artifacts/Cast-windows-x64.zip --verify-tag --title "Cast $RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease

      - name: Build failure details
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo '### Build failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -80 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
